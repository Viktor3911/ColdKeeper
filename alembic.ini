# Alembic configuration. The database URL is NOT stored here: env.py reads COLDKEEPER_DATABASE_URL
# (or .env) through backend.settings. Run through uv: uv run --locked alembic upgrade head
[alembic]
script_location = %(here)s/backend/adapters/db/migrations
prepend_sys_path = %(here)s
file_template = %%(rev)s_%%(slug)s
output_encoding = utf-8
path_separator = os

[post_write_hooks]
# New revisions are formatted with the project's tools from the locked uv environment.
hooks = black, ruff
black.type = exec
black.executable = uv
black.options = run --locked black -q REVISION_SCRIPT_FILENAME
ruff.type = exec
ruff.executable = uv
ruff.options = run --locked ruff check --fix -q REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
