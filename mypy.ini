# The single source of mypy settings (pyproject.toml has no [tool.mypy]).
# Taskfile and pre-commit run: uv run --locked mypy --config-file mypy.ini
[mypy]
python_version = 3.13
packages = backend, tests
plugins = pydantic.mypy
strict = True
warn_unreachable = True
enable_error_code = ignore-without-code, redundant-expr, truthy-bool
show_error_codes = True
pretty = True

[pydantic-mypy]
init_forbid_extra = True
init_typed = True
warn_required_dynamic_aliases = True
